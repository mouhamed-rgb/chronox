name: CHRONOX Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.chronox .
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          kotlin_dsl = p.exists()
          if not kotlin_dsl:
              p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('Android app Gradle file was not generated')
          s = p.read_text()
          if kotlin_dsl:
              enabled = 'isCoreLibraryDesugaringEnabled = true'
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled = 'coreLibraryDesugaringEnabled true'
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if enabled not in s:
              if 'compileOptions {' in s:
                  s = s.replace('compileOptions {', 'compileOptions {\\n        ' + enabled, 1)
              else:
                  s = s.replace('android {', 'android {\\n    compileOptions {\\n        ' + enabled + '\\n    }', 1)
          if dependency not in s:
              if 'dependencies {' in s:
                  s = s.replace('dependencies {', 'dependencies {\\n    ' + dependency, 1)
              else:
                  s += '\\n\\ndependencies {\\n    ' + dependency + '\\n}\\n'
          p.write_text(s)
          print(f'Enabled core library desugaring in {p}')
          PY
      - name: Add Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.VIBRATE"/>'''
          s=s.replace('<application',perms+'\n    <application',1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze lib --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chronox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
